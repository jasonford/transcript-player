<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript Player Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4efe7;
      color: #1f1a17;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(150, 108, 76, 0.18), transparent 35%),
        linear-gradient(180deg, #f8f4ee 0%, #efe6da 100%);
    }

    main {
      width: min(960px, calc(100vw - 32px));
      margin: 32px auto;
      padding: 24px;
      border: 1px solid rgba(58, 43, 32, 0.12);
      border-radius: 18px;
      background: rgba(255, 251, 246, 0.88);
      box-shadow: 0 18px 50px rgba(73, 52, 38, 0.12);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0 0 20px;
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(31, 26, 23, 0.78);
    }

    .demo-switcher {
      display: inline-flex;
      gap: 4px;
      margin: 0 0 18px;
      padding: 4px;
      border: 1px solid rgba(58, 43, 32, 0.16);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.55);
    }

    .demo-switcher button {
      appearance: none;
      border: 0;
      border-radius: 7px;
      padding: 8px 12px;
      background: transparent;
      color: #35271f;
      font: inherit;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .demo-switcher button[aria-pressed="true"] {
      background: #35271f;
      color: #fffaf3;
    }

    transcript-player {
      display: block;
      height: min(80vh, 920px);
    }

  </style>
</head>
<body>
  <main>
    <h1>Transcript Player Test</h1>
    <p>
      Switch between the local fixtures to test video, audio, and audio-only video playback.
    </p>

    <div class="demo-switcher" aria-label="Demo media">
      <button type="button" data-demo="video" aria-pressed="true">Video</button>
      <button type="button" data-demo="audio" aria-pressed="false">Audio</button>
      <button type="button" data-demo="video-audio" aria-pressed="false">Video As Audio</button>
    </div>

    <transcript-player
      id="player"
      src="./sintel_trailer-480p.mp4"
      transcript="./sintel_trailer-480p.oneword.srt"
      controls
      playsinline
      preload="metadata"
      scroll-behavior="smooth"
    ></transcript-player>
  </main>

  <script type="module" src="./transcript-player.js"></script>
  <script>
    const demos = {
      video: {
        src: './sintel_trailer-480p.mp4',
        audioOnly: false,
        transcript: './sintel_trailer-480p.oneword.srt'
      },
      audio: {
        src: './demo-audio.wav',
        audioOnly: false,
        transcript: './demo-audio.oneword.srt'
      },
      'video-audio': {
        src: './sintel_trailer-480p.mp4',
        audioOnly: true,
        transcript: './sintel_trailer-480p.oneword.srt'
      }
    }

    const player = document.querySelector('#player')
    const buttons = document.querySelectorAll('[data-demo]')

    function setDemo(name) {
      const demo = demos[name]
      if (!player || !demo) return

      player.removeAttribute('start-text')
      player.removeAttribute('video-src')
      player.removeAttribute('audio-src')
      player.removeAttribute('srt-url')
      player.toggleAttribute('audio-only', demo.audioOnly)
      player.setAttribute('src', demo.src)
      player.setAttribute('transcript', demo.transcript)

      for (const button of buttons) {
        button.setAttribute('aria-pressed', String(button.dataset.demo === name))
      }
    }

    for (const button of buttons) {
      button.addEventListener('click', () => setDemo(button.dataset.demo))
    }
  </script>
</body>
</html>
